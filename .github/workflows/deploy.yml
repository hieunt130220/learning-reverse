name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Connect and Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          RAW_USER: ${{ secrets.SERVER_USER }}
          RAW_HOST: ${{ secrets.SERVER_HOST }}
          RAW_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/avatar-web' }}
        run: |
          # 1. Làm sạch và chuẩn hóa biến môi trường
          CLEAN_USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          CLEAN_HOST=$(echo "$RAW_HOST" | tr -d '[:space:]')
          CLEAN_PORT=$(echo "$RAW_PORT" | tr -d '[:space:]')

          TARGET_USER="${CLEAN_USER:-dev_nguyentrunghieu}"
          TARGET_HOST="${CLEAN_HOST:-34.46.208.67}"
          TARGET_PORT="${CLEAN_PORT:-22}"

          echo "🚀 Đang kết nối tới máy chủ $TARGET_HOST với user $TARGET_USER qua cổng $TARGET_PORT..."

          # 2. Khởi tạo và kiểm tra Private SSH Key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "🔑 Fingerprint chìa khóa SSH tại GitHub Runner:"
          ssh-keygen -lf ~/.ssh/deploy_key

          # 3. Tự động nhận diện host key
          ssh-keyscan -p "$TARGET_PORT" "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 4. Kết nối SSH và chạy script deploy
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" << 'EOF'
            set -e

            echo "========================================="
            echo "🚀 Bắt đầu quá trình tự động Deploy trên VPS..."
            echo "========================================="

            # 1. Điều hướng tới thư mục chứa dự án
            TARGET_DIR="/var/www/avatar-web"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Thư mục $TARGET_DIR không tồn tại trên máy chủ!"
              exit 1
            fi
            cd "$TARGET_DIR"

            # 2. Cập nhật mã nguồn mới nhất từ branch main
            echo "📥 Đang đồng bộ mã nguồn mới nhất từ origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # Tự động phát hiện cấu trúc thư mục
            if [ -d "avatar-web/server" ]; then
              BASE_PATH="avatar-web"
            else
              BASE_PATH="."
            fi

            # 3. Triển khai Backend Server
            echo "📦 [1/2] Đang cập nhật Backend Server..."
            cd "$TARGET_DIR/$BASE_PATH/server"
            npm install
            npm run build

            # Reload lại tiến trình PM2 (hoặc start mới nếu chưa tồn tại)
            if pm2 list | grep -q "avatar-web"; then
              echo "🔄 Đang reload PM2 service avatar-web..."
              pm2 reload avatar-web --update-env
            else
              echo "▶️ Đang khởi động PM2 service avatar-web lần đầu..."
              pm2 start dist/index.js --name "avatar-web"
            fi
            pm2 save

            # 4. Triển khai Frontend Web UI
            echo "🎨 [2/2] Đang cập nhật Frontend Web UI..."
            cd "$TARGET_DIR/$BASE_PATH/web"
            npm install
            npm run build

            echo "========================================="
            echo "✅ Deploy hoàn tất thành công 100%!"
            echo "========================================="
          EOF
