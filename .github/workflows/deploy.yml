name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Connect and Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          RAW_USER: ${{ secrets.SERVER_USER }}
          RAW_HOST: ${{ secrets.SERVER_HOST }}
          RAW_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/avatar-web' }}
        run: |
          set -euo pipefail

          # 1. Làm sạch và chuẩn hóa biến môi trường
          CLEAN_USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          CLEAN_HOST=$(echo "$RAW_HOST" | tr -d '[:space:]')
          CLEAN_PORT=$(echo "$RAW_PORT" | tr -d '[:space:]')
          CLEAN_PATH=$(echo "$DEPLOY_PATH" | tr -d '[:space:]')

          TARGET_USER="${CLEAN_USER:-dev_nguyentrunghieu}"
          TARGET_HOST="${CLEAN_HOST:-34.46.208.67}"
          TARGET_PORT="${CLEAN_PORT:-22}"
          TARGET_DIR="${CLEAN_PATH:-/var/www/avatar-web}"

          echo "🚀 Đang kết nối tới máy chủ $TARGET_HOST với user $TARGET_USER qua cổng $TARGET_PORT..."

          # 2. Khởi tạo và kiểm tra Private SSH Key từ Secret
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_KEY" ]; then
            echo "❌ ERROR: Secret SERVER_SSH_KEY đang rỗng hoặc chưa được khai báo trong GitHub Repository Secrets!"
            exit 1
          fi

          KEY_CONTENT="$SSH_KEY"
          # Tự động format nếu secret bị dán dưới dạng literal \n
          if echo "$KEY_CONTENT" | grep -q '\\n'; then
            echo "ℹ️ Phát hiện literal \n trong secret, đang tự động format lại..."
            KEY_CONTENT=$(printf "%b" "$KEY_CONTENT")
          fi

          printf "%s\n" "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Kiểm tra tính hợp lệ của Private SSH Key
          if ! ssh-keygen -lf ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "❌ ERROR: Secret SERVER_SSH_KEY không phải là Private SSH Key hợp lệ!"
            exit 1
          fi

          echo "🔑 Fingerprint chìa khóa SSH tại GitHub Runner:"
          ssh-keygen -lf ~/.ssh/deploy_key

          echo "📋 Public Key tương ứng (cần có trong ~/.ssh/authorized_keys trên VPS):"
          ssh-keygen -y -f ~/.ssh/deploy_key

          # 3. Tự động nhận diện host key
          ssh-keyscan -p "$TARGET_PORT" "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 4. Kết nối SSH và chạy script deploy
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "TARGET_DIR='$TARGET_DIR' bash -s" << 'EOF'
            set -euo pipefail

            echo "========================================="
            echo "🚀 Bắt đầu quá trình tự động Deploy trên VPS..."
            echo "========================================="

            # 1. Điều hướng tới thư mục chứa dự án
            TARGET_DIR="${TARGET_DIR:-/var/www/avatar-web}"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Thư mục $TARGET_DIR không tồn tại trên máy chủ!"
              exit 1
            fi
            cd "$TARGET_DIR"

            # 2. Cập nhật mã nguồn mới nhất từ branch main
            echo "📥 Đang đồng bộ mã nguồn mới nhất từ origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # Tự động phát hiện cấu trúc thư mục
            if [ -d "avatar-web/server" ]; then
              BASE_PATH="avatar-web"
            else
              BASE_PATH="."
            fi

            SOLVER_ROOT="$TARGET_DIR/captcha-solver"
            SOLVER_VENV="$TARGET_DIR/.venv-captcha"
            PUBLIC_SOLVER_URL="https://avt3xauto.duckdns.org/api/solver/"

            FISHING_ROOT="$TARGET_DIR/$BASE_PATH/fishing-ml"
            FISHING_VENV="$FISHING_ROOT/.venv"
            FISHING_FROZEN="$FISHING_ROOT/artifacts/p2-photometric_plus_geom-off-t0.05-dim_128-db8460d9b1cabc01/frozen"

            echo "🔎 Đang kiểm tra runtime assets của captcha solver..."
            for required_file in \
              "$SOLVER_ROOT/solver_server.py" \
              "$SOLVER_ROOT/requirements-runtime.txt" \
              "$SOLVER_ROOT/checkpoints/crnn_ctc.pt" \
              "$SOLVER_ROOT/data/cached_chip_config.bin" \
              "$SOLVER_ROOT/data/cached_data_php.bin" \
              "$SOLVER_ROOT/data/cached_teacher_php.bin"
            do
              if [ ! -f "$required_file" ]; then
                echo "❌ Thiếu runtime asset: $required_file"
                exit 1
              fi
            done

            echo "🔎 Đang kiểm tra runtime assets của fishing-ml..."
            for required_file in \
              "$FISHING_ROOT/run_service.py" \
              "$FISHING_FROZEN/best-dev.pt" \
              "$FISHING_FROZEN/freeze-manifest.json" \
              "$FISHING_FROZEN/model-config.json" \
              "$FISHING_FROZEN/normalization.json" \
              "$FISHING_FROZEN/thresholds.json"
            do
              if [ ! -f "$required_file" ]; then
                echo "❌ Thiếu fishing-ml runtime asset: $required_file"
                exit 1
              fi
            done

            # 3. Triển khai Captcha Solver
            echo "🧠 [1/4] Đang cập nhật Captcha Solver..."
            if ! python3 -m venv "$SOLVER_VENV"; then
              echo "ℹ️ python3-venv không có; dùng virtualenv zipapp không cần sudo..."
              PYTHON_MINOR=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
              VIRTUALENV_PYZ="$TARGET_DIR/.cache/virtualenv-${PYTHON_MINOR}.pyz"
              mkdir -p "$TARGET_DIR/.cache"
              curl --fail --silent --show-error --location \
                --retry 3 --retry-delay 2 --retry-all-errors \
                "https://bootstrap.pypa.io/virtualenv/${PYTHON_MINOR}/virtualenv.pyz" \
                -o "$VIRTUALENV_PYZ"
              python3 "$VIRTUALENV_PYZ" --clear "$SOLVER_VENV"
            fi
            "$SOLVER_VENV/bin/python" -m pip install --upgrade pip
            "$SOLVER_VENV/bin/python" -m pip install \
              -r "$SOLVER_ROOT/requirements-runtime.txt"
            "$SOLVER_VENV/bin/python" -c \
              "import sys, torch, numpy, PIL; print(sys.version); print(torch.__version__, numpy.__version__, PIL.__version__)"

            cd "$SOLVER_ROOT"
            pm2 delete captcha-solver >/dev/null 2>&1 || true
            pm2 start solver_server.py \
              --name captcha-solver \
              --interpreter "$SOLVER_VENV/bin/python" \
              -- \
              --host 127.0.0.1 \
              --port 8643 \
              --public-base-url "$PUBLIC_SOLVER_URL"

            if ! curl --fail --silent --show-error \
              --retry 12 --retry-delay 2 --retry-all-errors \
              http://127.0.0.1:8643/health
            then
              echo "❌ Captcha solver local health check thất bại"
              pm2 logs captcha-solver --lines 120 --nostream || true
              exit 1
            fi

            # 4. Triển khai AI Fishing ML
            echo "🎣 [2/4] Đang cập nhật AI Fishing ML Service..."
            if ! python3 -m venv "$FISHING_VENV"; then
              echo "ℹ️ python3-venv không có; dùng virtualenv zipapp không cần sudo..."
              PYTHON_MINOR=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
              VIRTUALENV_PYZ="$TARGET_DIR/.cache/virtualenv-${PYTHON_MINOR}.pyz"
              mkdir -p "$TARGET_DIR/.cache"
              curl --fail --silent --show-error --location \
                --retry 3 --retry-delay 2 --retry-all-errors \
                "https://bootstrap.pypa.io/virtualenv/${PYTHON_MINOR}/virtualenv.pyz" \
                -o "$VIRTUALENV_PYZ"
              python3 "$VIRTUALENV_PYZ" --clear "$FISHING_VENV"
            fi
            "$FISHING_VENV/bin/python" -m pip install --upgrade pip
            "$FISHING_VENV/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            "$FISHING_VENV/bin/python" -m pip install -e "$FISHING_ROOT"

            cd "$FISHING_ROOT"
            pm2 delete fishing-ml >/dev/null 2>&1 || true
            pm2 start run_service.py \
              --name fishing-ml \
              --interpreter "$FISHING_VENV/bin/python" \
              -- \
              --host 127.0.0.1 \
              --port 8080 \
              --frozen-dir "$FISHING_FROZEN"

            if ! curl --fail --silent --show-error \
              --retry 12 --retry-delay 2 --retry-all-errors \
              http://127.0.0.1:8080/health
            then
              echo "❌ Fishing ML service local health check thất bại"
              pm2 logs fishing-ml --lines 120 --nostream || true
              exit 1
            fi

            # 5. Triển khai Backend Server
            echo "📦 [3/4] Đang cập nhật Backend Server..."
            cd "$TARGET_DIR/$BASE_PATH/server"
            npm install
            npm run build

            # Reload lại tiến trình PM2 (hoặc start mới nếu chưa tồn tại)
            if pm2 describe avatar-web >/dev/null 2>&1; then
              echo "🔄 Đang reload PM2 service avatar-web..."
              pm2 reload avatar-web --update-env
            else
              echo "▶️ Đang khởi động PM2 service avatar-web lần đầu..."
              pm2 start dist/index.js --name "avatar-web"
            fi

            if ! curl --fail --silent --show-error \
              --retry 12 --retry-delay 2 --retry-all-errors \
              "${PUBLIC_SOLVER_URL}health"
            then
              echo "❌ Public captcha solver health check thất bại"
              pm2 logs captcha-solver --lines 120 --nostream || true
              pm2 logs avatar-web --lines 120 --nostream || true
              exit 1
            fi

            # 6. Triển khai Frontend Web UI
            echo "🎨 [4/4] Đang cập nhật Frontend Web UI..."
            cd "$TARGET_DIR/$BASE_PATH/web"
            npm install
            npm run build

            pm2 save
            pm2 status

            echo "========================================="
            echo "✅ Deploy hoàn tất thành công 100%!"
            echo "========================================="
          EOF
